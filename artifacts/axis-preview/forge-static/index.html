<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Axis</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      min-height: 100dvh;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #f9fafb;
      color: #111827;
    }
    .wrap {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      text-align: center;
      max-width: 28rem;
    }
    h1 {
      margin: 0;
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    p {
      margin: 0.75rem 0 0;
      font-size: 0.95rem;
      color: #4b5563;
      line-height: 1.5;
    }
    .badge {
      display: inline-block;
      margin-top: 1.25rem;
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      background: #111827;
      color: #f9fafb;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Axis</h1>
      <p>Your app will appear here once it&rsquo;s ready.</p>
      <span class="badge">Forge preview</span>
    </div>
  </div>
</body>
</html>
